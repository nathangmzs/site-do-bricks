<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infos do clima - PARÁ DROIDS</title>
  <link rel="shortcut icon" href="Icons/logo.ico">
  <script src="https://kit.fontawesome.com/2745e261bc.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/rainStyle.css" />
</head>

<body>
  <img id="background-logo" src="Icons/logo.png" alt="Logo da equipe" class="logo3" />

  <header id="main-header">
    <div class="header-logo">
        <img src="Icons/logodark.png" class="header-logo-img" alt="Logo da equipe" >
    </div>
    <h1 class="title">PARÁDROIDS</h1>
    <button id="theme-toggle" class="toggle-btn" onclick="toggleMode()">
      <svg id="sun-icon" class="icon active" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg id="moon-icon" class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
      </svg>
  </button>
</header>
  
  <div class="wrapper">
    <p class="info-text">Tempo - Stats 🌞</p>
    <section class="input-part">
      <input type="text" placeholder="Insira o nome da cidade aqui:">
    </section>

    <section class="first-part">
      <img src="Icons/cloud.png" alt="weather">
      <div class="temp">
        <span class="deg">°</span>
        <span class="numb"></span>
        <div class="weather">__</div>
      </div>

      <div class="location">
        <i class="fas fa-map-marker-alt"></i>
        <span>__ , __</span>
      </div>
    </section>

    <section class="second-part">
      <div class="weatherSpace">
        <span class="weatherState">Clima</span>
      </div>
        <div class="temp">
          <span class="numb-2"></span>
      </div>

      <div class="column-1">
        <i class="fas fa-tint"></i>
        <div class="details">
          <span>__</span>
          <p>por m² </p>
        </div>
      </div>

      <div class="column-2">
        <i class="fas fa-bolt"></i>
        <div class="details">
          <span class="energy-generated">__</span>
          <p>Energia gerada</p>
        </div>
    </div>
    </section>
  </div>

  <script src="scripts/app.js" type="module"></script>
  <script src="scripts/rain.js" type="module"></script>
  <script src="scripts/toggle.js"></script>
</body>

</html>
