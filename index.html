<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infos do clima - PARÁ DROIDS</title>
  <link rel="shortcut icon" href="Icons/logo.ico">
  <script src="https://kit.fontawesome.com/2745e261bc.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/rainStyle.css" />
</head>

<body>  

    <div class="logo">
        <img src="Icons/logo.png" class="logo3">
    </div>

  <div class="wrapper">
    <p class="info-text">Tempo - Stats 🌞</p>
    <section class="input-part">
      <input type="text" placeholder="Insira o nome da cidade aqui:">
    </section>

    <section class="first-part">
      <img src="Icons/cloud.png">
      <div class="temp">
        <span class="deg">°</span>
        <span class="numb"></span>
        <div class="weather">__</div>
      </div>

      <div class="location">
        <i class="fas fa-map-marker-alt"></i>
        <span>__ , __</span>
      </div>
    </section>

    <section class="second-part">
        <div class="temp">
          <span class="numb-2"></span>
      </div>

      <div class="column-1">
        <i class="fas fa-tint"></i>
        <div class="details">
          <span>__</span>
          <p>por m² </p>
        </div>
      </div>

      <div class="column-2">
        <i class="fas fa-bolt"></i>
        <div class="details">
          <span class="energy-generated">__</span>
          <p>Energia gerada</p>
        </div>
    </div>
    </section>
  </div>

  <script src="scripts/app.js" type="module"></script>
  <script src="scripts/alert.js" type="module"></script>
</body>

</html>
